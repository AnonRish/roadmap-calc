[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roadmap-calc"
version = "0.1.0"
description = "Exact, tested calculators and consistency checks for the numbers in the AI 2040 alignment roadmap: risk table, safety-acceleration BOTEC and effort portfolios."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AnonRish" }]
keywords = ["ai-safety", "alignment", "forecasting", "calculator", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [

]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
roadmap-calc = "roadmap_calc.cli:main"

[project.urls]
Homepage = "https://github.com/AnonRish/roadmap-calc"
Issues = "https://github.com/AnonRish/roadmap-calc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadmap_calc = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=roadmap_calc --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["slow: statistical calibration tests that take longer to run"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
